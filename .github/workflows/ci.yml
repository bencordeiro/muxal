name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld cmake pkg-config \
            libfontconfig-dev libfreetype6-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libasound2-dev libvulkan-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Sandbox tests for the user-facing install/update script (scripts/get.sh):
  # fake release + local server + mktemp HOME; never touches the real system.
  updater:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: install-script sandbox tests
        run: scripts/test-get.sh

  # The English string IS the translation key, so en.json is the key list every
  # locale is measured against. If it drifts from the t()/tf()/tn() calls in the
  # source, new UI strings silently render in English for every non-English
  # user — so the drift is a hard failure here instead.
  i18n:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: catalog in sync with source
        run: python3 scripts/translate.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        # Native Linux x86/ARM and Intel macOS. The Intel Mac pool avoids
        # recurring hosted Apple Silicon allocation failures. Universal release
        # builds still cover both Mac architectures; on-demand terminal tests
        # can additionally target Apple Silicon via terminal-macos.yml.
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld cmake pkg-config \
            libfontconfig-dev libfreetype6-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libasound2-dev libvulkan-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'macOS' && format('macos-terminal-{0}', runner.arch) || '' }}
          cache-on-failure: ${{ runner.os == 'macOS' }}
      - run: cargo build --workspace
      - run: cargo test --workspace
