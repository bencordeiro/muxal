[package]
name = "muxal-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core domain types for muxal: projects, agent instances, and the pane layout tree."

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# PowerShell's `-EncodedCommand` takes UTF-16LE base64. Already in the tree via
# muxal-terminal, so this adds a dependency edge, not a new crate.
base64 = "0.22"
# Reuse the syntax parser/grammar already shipped by the editor. No compiler or
# language-server process is needed for Spider's bounded Rust import overlay.
tree-sitter = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.23.6"
toml = "0.8"

[dev-dependencies]
serde_json.workspace = true
