[package]
name = "muxal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A multi-agent terminal multiplexer for managing many AI coding agents across projects."

[[bin]]
name = "muxal"
path = "src/main.rs"

[dependencies]
ureq = "3"
env_logger = "0.11"
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
muxal-core.workspace = true
muxal-terminal.workspace = true
muxal-store.workspace = true
muxal-tray.workspace = true
anyhow.workspace = true
log.workspace = true
uuid.workspace = true
serde_json.workspace = true
# Shared UI/background channels (already in the tree via muxal-terminal).
async-channel = "2.3"
# Playback only; no recording, network media, or unused codecs.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "flac", "vorbis", "wav"] }
notify-rust = "4"
# debug-embed: always bake files into the binary, even in debug builds.
# Without this, rust-embed reads icons from disk under CARGO_MANIFEST_DIR
# (e.g. the primary user's .cargo/git/checkouts/gpui-component-*/assets). That breaks
# secondary Windows identities (AgentWorker via runas) which cannot read the
# primary user's profile — title-bar min/max/close and other gpui-component
# icons render as empty gray plates. Feature unification applies this to
# gpui-component-assets as well.
rust-embed = { version = "8", features = ["debug-embed"] }
# Decode the embedded app icon (PNG) to RGBA for the Windows/macOS tray icon.
image = { version = "0.25", default-features = false, features = ["png"] }
# Detect the OS UI locale at startup for i18n (already resolved transitively).
sys-locale = "0.3"
# Gitignore-aware file walk for the Ctrl+P search palette.
ignore = "0.4"
# Already present through GPUI; Spider uses native events only while an enabled
# activity/connections overlay has a visible consumer.
notify = "7.0"
# Local wall-clock time for scheduled Loops (time-of-day + interval firing).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# `setrlimit(RLIMIT_NOFILE)` at startup — see `raise_open_file_limit` in main.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native focus/presentation diagnostics; these versions are already used by GPUI.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Embeds the .exe icon (see build.rs); Windows build-host only, so it never
# affects the Linux/macOS builds.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# --- Linux .deb packaging (cargo-deb) ---
# Asset source paths are resolved relative to THIS crate's directory, so files
# at the workspace root are reached with `../../`. The release workflow builds
# the binary first and runs `cargo deb --no-build -p muxal`.
[package.metadata.deb]
maintainer = "ProjectHax LLC"
copyright = "2026, ProjectHax LLC"
section = "utils"
priority = "optional"
# Hand-maintained against the native link closure; never regenerate with `$auto`
# on the release build host. Keep the Ubuntu 22.04 minimums used by CI. The
# retired browser's GTK/GLib/WebKit/JavaScriptCore/libsoup requirements are gone.
# When a native dependency changes, re-run
# `dpkg-shlibdeps -O -e target/release/muxal` and update this list. Use `t64 | old`
# alternatives if a future dependency has a renamed runtime package.
depends = "libasound2t64 (>= 1.0.29) | libasound2 (>= 1.0.29), libc6 (>= 2.35), libgcc-s1 (>= 4.2), libxcb1 (>= 1.12), libxkbcommon-x11-0 (>= 0.5.0), libxkbcommon0 (>= 0.5.0)"
extended-description = """\
muxal is a terminal multiplexer for managing many AI coding agents (Claude, \
Ollama, and others) across multiple projects, with split panes, tmux/worktree \
integration, and one-click task runners."""
assets = [
    ["../../target/release/muxal", "usr/bin/muxal", "755"],
    ["../../packaging/muxal.desktop", "usr/share/applications/muxal.desktop", "644"],
    ["assets/muxal.svg", "usr/share/icons/hicolor/scalable/apps/muxal.svg", "644"],
    ["assets/muxal.png", "usr/share/icons/hicolor/256x256/apps/muxal.png", "644"],
    ["../../README.md", "usr/share/doc/muxal/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/muxal/LICENSE", "644"],
    ["../../LICENSING.md", "usr/share/doc/muxal/LICENSING.md", "644"],
    ["../../packaging/licenses/README.md", "usr/share/doc/muxal/licenses/README.md", "644"],
    ["../../packaging/licenses/Rodio-Apache-2.0.txt", "usr/share/doc/muxal/licenses/Rodio-Apache-2.0.txt", "644"],
    ["../../packaging/licenses/Rodio-MIT.txt", "usr/share/doc/muxal/licenses/Rodio-MIT.txt", "644"],
    ["../../packaging/licenses/RustAudio-Apache-2.0.txt", "usr/share/doc/muxal/licenses/RustAudio-Apache-2.0.txt", "644"],
    ["../../packaging/licenses/Symphonia-MPL-2.0.txt", "usr/share/doc/muxal/licenses/Symphonia-MPL-2.0.txt", "644"],
]

# --- Linux .rpm packaging (cargo-generate-rpm) ---
# Unlike cargo-deb, cargo-generate-rpm resolves `source` paths relative to the
# directory it is invoked from. The release workflow runs it from the workspace
# root: `cargo generate-rpm -p crates/muxal`.
[package.metadata.generate-rpm]
summary = "Multi-agent terminal multiplexer for AI coding agents"
assets = [
    { source = "target/release/muxal", dest = "/usr/bin/muxal", mode = "755" },
    { source = "packaging/muxal.desktop", dest = "/usr/share/applications/muxal.desktop", mode = "644" },
    { source = "crates/muxal/assets/muxal.svg", dest = "/usr/share/icons/hicolor/scalable/apps/muxal.svg", mode = "644" },
    { source = "crates/muxal/assets/muxal.png", dest = "/usr/share/icons/hicolor/256x256/apps/muxal.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/muxal/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/muxal/LICENSE", mode = "644", doc = true },
    { source = "LICENSING.md", dest = "/usr/share/doc/muxal/LICENSING.md", mode = "644", doc = true },
    { source = "packaging/licenses/README.md", dest = "/usr/share/doc/muxal/licenses/README.md", mode = "644", doc = true },
    { source = "packaging/licenses/Rodio-Apache-2.0.txt", dest = "/usr/share/doc/muxal/licenses/Rodio-Apache-2.0.txt", mode = "644", doc = true },
    { source = "packaging/licenses/Rodio-MIT.txt", dest = "/usr/share/doc/muxal/licenses/Rodio-MIT.txt", mode = "644", doc = true },
    { source = "packaging/licenses/RustAudio-Apache-2.0.txt", dest = "/usr/share/doc/muxal/licenses/RustAudio-Apache-2.0.txt", mode = "644", doc = true },
    { source = "packaging/licenses/Symphonia-MPL-2.0.txt", dest = "/usr/share/doc/muxal/licenses/Symphonia-MPL-2.0.txt", mode = "644", doc = true },
]
